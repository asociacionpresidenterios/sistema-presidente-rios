name: Fix button navigation once

on: push

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          old = '''@app.route("/")
def index():
    # V9.0: si el administrador entra a la raíz del sistema,
    # llevarlo siempre al Inicio de gestión y no al antiguo registro
    # de jugadores. El acceso público sin sesión conserva su comportamiento.
    if session.get("admin_id"):
        return redirect(url_for("admin_panel_maestro"))
'''
          new = '''@app.route("/")
@app.route("/admin/jugadores", endpoint="admin_jugadores")
def index():
    # La raíz es exclusivamente Inicio para administradores.
    # El listado de jugadores tiene una ruta propia.
    if session.get("admin_id") and request.path == "/":
        return redirect(url_for("admin_panel_maestro"))
'''
          if old not in s:
              raise SystemExit('No se encontró el bloque esperado de index()')
          s = s.replace(old, new, 1)

          old = '''    flash(
        "Jugador eliminado.",
        "success"
    )

    return redirect(
        url_for("index")
    )
'''
          new = '''    flash(
        "Jugador eliminado.",
        "success"
    )

    return redirect(
        url_for("admin_jugadores")
    )
'''
          if old not in s:
              raise SystemExit('No se encontró el retorno esperado de eliminar_jugador()')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('templates/base.html')
          s = p.read_text(encoding='utf-8')
          old = '''    <a class="nav-item {% if request.endpoint in ['index','nuevo_jugador','editar_jugador','importar_jugadores','ficha_jugador','historial_jugador','admin_centro_jugador'] %}active{% endif %}" href="{{ url_for('index') }}"><span class="nav-icon">👥</span>Jugadores</a>'''
          new = '''    <a class="nav-item {% if request.endpoint in ['admin_jugadores','index','nuevo_jugador','editar_jugador','importar_jugadores','ficha_jugador','historial_jugador','admin_centro_jugador'] %}active{% endif %}" href="{{ url_for('admin_jugadores') }}"><span class="nav-icon">👥</span>Jugadores</a>'''
          if old not in s:
              raise SystemExit('No se encontró el enlace Jugadores de base.html')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('templates/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace("url_for('index')", "url_for('admin_jugadores')")
          p.write_text(s, encoding='utf-8')

          p = Path('templates/publico.html')
          s = p.read_text(encoding='utf-8')
          old = '''<button class="active" data-target="posiciones" onclick="mostrarSeccion('posiciones',this)">📊 Posiciones</button>
<button data-target="programacion" onclick="mostrarSeccion('programacion',this)">📅 Programación</button>
<button data-target="resultados" onclick="mostrarSeccion('resultados',this)">⚽ Resultados</button>
<button data-target="goleadores" onclick="mostrarSeccion('goleadores',this)">🥅 Goleadores</button>
<button data-target="estadisticas" onclick="mostrarSeccion('estadisticas',this)">📈 Estadísticas</button>
<button data-target="fairplay" onclick="mostrarSeccion('fairplay',this)">🟧 Fair Play</button>
<button data-target="enlaces" onclick="mostrarSeccion('enlaces',this)">🔗 Más información</button>'''
          new = '''<a class="active" data-target="posiciones" href="{{ url_for('publico_tabla',campeonato_id=series_publicas[0][1][0].campeonato.id) }}">📊 Posiciones</a>
<a data-target="programacion" href="{{ url_for('publico_programacion',campeonato_id=series_publicas[0][1][0].campeonato.id) }}">📅 Programación</a>
<a data-target="resultados" href="{{ url_for('publico_resultados',campeonato_id=series_publicas[0][1][0].campeonato.id) }}">⚽ Resultados</a>
<a data-target="goleadores" href="{{ url_for('publico_goleadores',campeonato_id=series_publicas[0][1][0].campeonato.id) }}">🥅 Goleadores</a>
<a data-target="estadisticas" href="{{ url_for('publico_estadisticas',campeonato_id=series_publicas[0][1][0].campeonato.id) }}">📈 Estadísticas</a>
<a data-target="fairplay" href="{{ url_for('publico_fair_play',campeonato_id=series_publicas[0][1][0].campeonato.id) }}">🟧 Fair Play</a>
<a data-target="enlaces" href="{{ url_for('publico_campeonato',campeonato_id=series_publicas[0][1][0].campeonato.id) }}">🔗 Más información</a>'''
          if old not in s:
              raise SystemExit('No se encontró el menú público esperado')
          s = s.replace(old, new, 1)

          old = '''.menu button{width:100%;border:0;border-bottom:1px solid #edf0f4;background:#fff;text-align:left;padding:13px 14px;font-weight:800;color:#172033;cursor:pointer}.menu button.active{background:#eaf2ff;color:#1459bd;border-left:4px solid #1769e0}'''
          new = '''.menu button,.menu a{width:100%;display:block;border:0;border-bottom:1px solid #edf0f4;background:#fff;text-align:left;padding:13px 14px;font-weight:800;color:#172033;cursor:pointer;text-decoration:none}.menu button.active,.menu a.active{background:#eaf2ff;color:#1459bd;border-left:4px solid #1769e0}'''
          if old not in s:
              raise SystemExit('No se encontró el CSS del menú público')
          s = s.replace(old, new, 1)

          old = '''.menu button{display:block;flex:0 0 auto;width:auto;border-bottom:0;border-right:1px solid #edf0f4;padding:12px 13px;font-size:12px}.menu button.active{border-left:0;border-bottom:3px solid #1769e0}'''
          new = '''.menu button,.menu a{display:block;flex:0 0 auto;width:auto;border-bottom:0;border-right:1px solid #edf0f4;padding:12px 13px;font-size:12px}.menu button.active,.menu a.active{border-left:0;border-bottom:3px solid #1769e0}'''
          if old not in s:
              raise SystemExit('No se encontró el CSS responsive del menú público')
          s = s.replace(old, new, 1)

          old = '''function seleccionarCampeonato(id){
  const elegido=document.getElementById(id);
  if(!elegido)return;
  campeonatos.forEach(x=>x.classList.toggle('active',x.id===id));
  const select=document.getElementById('champSelect');
  if(select && select.value!==id)select.value=id;
  mostrarSeccion('posiciones',document.querySelector('#menu button[data-target="posiciones"]'));
  window.scrollTo({top:0,behavior:'smooth'});
}'''
          new = '''function seleccionarCampeonato(id){
  const elegido=document.getElementById(id);
  if(!elegido)return;
  campeonatos.forEach(x=>x.classList.toggle('active',x.id===id));
  const select=document.getElementById('champSelect');
  if(select && select.value!==id)select.value=id;
  actualizarEnlacesMenu(id.replace('champ-',''));
  window.scrollTo({top:0,behavior:'smooth'});
}
function actualizarEnlacesMenu(campeonatoId){
  const rutas={
    posiciones:'/publico/campeonato/'+campeonatoId+'/tabla',
    programacion:'/publico/campeonato/'+campeonatoId+'/programacion',
    resultados:'/publico/campeonato/'+campeonatoId+'/resultados',
    goleadores:'/publico/campeonato/'+campeonatoId+'/goleadores',
    estadisticas:'/publico/campeonato/'+campeonatoId+'/estadisticas',
    fairplay:'/publico/campeonato/'+campeonatoId+'/fair-play',
    enlaces:'/publico/campeonato/'+campeonatoId
  };
  document.querySelectorAll('#menu a[data-target]').forEach(a=>{
    const ruta=rutas[a.dataset.target];
    if(ruta)a.href=ruta;
  });
}'''
          if old not in s:
              raise SystemExit('No se encontró seleccionarCampeonato()')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit repair and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-buttons-once.yml
          git add -A
          git commit -m "fix: repair admin and public navigation [button-fix]"
          git push

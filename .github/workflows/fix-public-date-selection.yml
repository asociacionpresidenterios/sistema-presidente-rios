name: Fix public date selection

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix public date logic
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('templates/publico.html')
          s = p.read_text(encoding='utf-8')
          new_parse = r'''function parseSpanishDate(s){
          const text=String(s||'').trim().toLowerCase();
          const months={enero:0,febrero:1,marzo:2,abril:3,mayo:4,junio:5,julio:6,agosto:7,septiembre:8,setiembre:8,octubre:9,noviembre:10,diciembre:11,january:0,february:1,march:2,april:3,may:4,june:5,july:6,august:7,september:8,october:9,november:10,december:11};
          let m=text.match(/(\\d{1,2})\\s+de\\s+([a-záéíóúñ]+)\\s+de\\s+(\\d{4})/);
          if(m&&months[m[2]]!==undefined)return new Date(+m[3],months[m[2]],+m[1]);
          m=text.match(/(?:monday|tuesday|wednesday|thursday|friday|saturday|sunday)\\s+(\\d{1,2})\\s+(?:of|de)\\s+([a-z]+)\\s+(\\d{4})/);
          if(m&&months[m[2]]!==undefined)return new Date(+m[3],months[m[2]],+m[1]);
          const iso=text.match(/(\\d{4})[-\\/](\\d{1,2})[-\\/](\\d{1,2})/);
          if(iso)return new Date(+iso[1],+iso[2]-1,+iso[3]);
          return null;
          }
          function formatSpanishDate(d){
          if(!d)return 'Fecha por confirmar';
          const days=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
          const months=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
          return `${days[d.getDay()]} ${d.getDate()} de ${months[d.getMonth()]} de ${d.getFullYear()}`;
          }'''
          s2 = re.sub(r'function parseSpanishDate\(s\)\{.*?\}\nfunction parseTime', new_parse + r'\nfunction parseTime', s, count=1, flags=re.S)
          new_render = r'''function renderMatchdays(html){
          const doc=new DOMParser().parseFromString(html,'text/html');
          const groups=[...doc.querySelectorAll('.jornada')].map((g,i)=>extractMatchday(g,i)).filter(x=>x.rows.length);
          if(!groups.length){matchdaysBox.innerHTML='<div class="empty">No hay programación publicada.</div>';fixtureStatus.textContent='Sin fechas';return;}
          const today=new Date();today.setHours(0,0,0,0);
          let current=groups.find(x=>x.earliest&&x.latest&&x.earliest<=today&&x.latest>=today);
          if(!current) current=groups.find(x=>x.earliest&&x.earliest>=today)||groups[groups.length-1];
          const next=groups.find(x=>x.index>current.index)||null;
          const selected=[{...current,label:'Fecha en curso',current:true},{...(next||{}),label:'Próxima fecha',current:false}].filter(x=>x.g);
          matchdaysBox.innerHTML=selected.map(x=>{
            const shown=x.rows.slice(0,8);let lastDate='';let lastVenue='';
            const body=shown.map(m=>{
              let block='';
              const parsed=parseSpanishDate(m.dateLabel);
              const displayDate=formatSpanishDate(parsed);
              if(displayDate!==lastDate){lastDate=displayDate;lastVenue='';block+=`<div class="match-group-title">${esc(displayDate)}</div>`;}
              if(m.venue!==lastVenue){lastVenue=m.venue;block+=`<div class="match-group-title">${esc(m.venue)}</div>`;}
              block+=`<div class="match-row"><div class="match-time">${esc(m.time)}</div><div><div class="match-teams">${esc(m.teams)}</div>${m.turn?`<div class="match-meta">${esc(m.turn)}</div>`:''}</div><div class="match-state">${esc(m.state)}</div></div>`;
              return block;
            }).join('');
            return `<div class="matchday-card ${x.current?'current':''}"><div class="matchday-head"><div><strong>${esc(x.title)}</strong>${x.current?'<div class="current-badge">Fecha en curso</div>':''}</div><span>${esc(x.label)}</span></div>${body}</div>`;
          }).join('');
          fixtureStatus.textContent=`${groups.length} fecha${groups.length===1?'':'s'} publicadas`;
          }'''
          s2 = re.sub(r'function renderMatchdays\(html\)\{.*?\}\nselect\.addEventListener', new_render + r'\nselect.addEventListener', s2, count=1, flags=re.S)
          if s2 == s:
              raise SystemExit('No se encontraron los bloques esperados; no se modifica el archivo.')
          p.write_text(s2, encoding='utf-8')
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/publico.html
          git rm .github/workflows/fix-public-date-selection.yml
          git commit -m "fix: select current public matchday and format dates in Spanish"
          git push

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Goleadores · {{ campeonato.nombre }}</title><style>body{margin:0;background:#f1f5f9;font-family:Arial;color:#0f172a}.top{background:#0f172a;color:#fff;padding:18px 5%}.top a{color:#fff;float:right}.wrap{max-width:1000px;margin:25px auto;padding:0 18px}.card{background:#fff;padding:22px;border-radius:18px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid #e5e7eb;text-align:left}.score{font-weight:900}</style></head><body><header class="top"><strong>⚽ Asociación Presidente Ríos</strong><div style="float:right;display:flex;gap:10px"><a href="{{ url_for('publico') }}">Inicio público</a><a href="{{ url_for('login') }}" style="background:#2563eb;padding:8px 11px;border-radius:8px;text-decoration:none;font-weight:800">🔐 Administración</a></div></header><main class="wrap"><div class="card"><h1>🥅 Goleadores</h1><p>{{ campeonato.nombre }} · Serie {{ campeonato.serie }}</p><table class="table"><tr><th>#</th><th>Jugador</th><th>Club</th><th>Serie</th><th>Goles</th></tr>{% for j,t in goleadores %}<tr><td>{{ loop.index }}</td><td>{{ j.nombre_completo }}</td><td>{{ j.club }}</td><td>{{ j.serie }}</td><td class="score">{{ t }}</td></tr>{% else %}<tr><td colspan="5">Sin registros.</td></tr>{% endfor %}</table></div></main></body></html>

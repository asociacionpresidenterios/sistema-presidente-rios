<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso Administración · Presidente Ríos</title>
<style>body{margin:0;background:linear-gradient(135deg,#0f172a,#1e3a5f);font-family:Arial,sans-serif;color:#0f172a;min-height:100vh;display:grid;place-items:center}.card{width:min(420px,92vw);background:#fff;border-radius:22px;padding:34px;box-shadow:0 25px 70px #0005}.logo{width:60px;height:60px;border-radius:16px;background:#f97316;color:#fff;display:grid;place-items:center;font-size:28px;margin-bottom:18px}h1{margin:0 0 8px;font-size:28px}p{color:#64748b;margin:0 0 25px}.field{margin:15px 0}.field label{display:block;font-weight:700;font-size:14px;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;box-sizing:border-box;font-size:15px}.btn{width:100%;padding:13px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:800;font-size:15px;cursor:pointer;margin-top:8px}.public{display:block;text-align:center;margin-top:18px;color:#2563eb;text-decoration:none;font-weight:700}.flash{padding:12px;border-radius:10px;background:#fee2e2;color:#991b1b;margin-bottom:15px;font-weight:700}</style></head>
<body><div class="card"><div class="logo">⚽</div><h1>Administración</h1><p>Asociación de Fútbol Presidente Ríos</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="next" value="{{ next }}"><div class="field"><label>Usuario</label><input name="username" autocomplete="username" required></div><div class="field"><label>Contraseña</label><input type="password" name="password" autocomplete="current-password" required></div><button class="btn">🔐 Ingresar</button></form><a class="public" href="{{ url_for('publico') }}">← Ir al portal público</a></div></body></html>

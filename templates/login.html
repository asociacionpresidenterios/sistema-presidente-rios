<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#252525"><title>Acceso Administración · Presidente Ríos</title>
<style>
:root{--orange:#c86418;--orange-dark:#a94f10;--cream:#f5e8dc;--ink:#252525;--muted:#707070;--bg:#f3f1ee}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 20%,rgba(200,100,24,.16),transparent 34%),linear-gradient(135deg,#252525 0%,#303030 58%,#3b3028 100%);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);min-height:100vh;display:grid;place-items:center;-webkit-font-smoothing:antialiased}.card{width:min(430px,92vw);background:#fff;border:1px solid rgba(255,255,255,.8);border-radius:14px;padding:36px;box-shadow:0 24px 60px rgba(0,0,0,.24)}.logo{width:62px;height:62px;border-radius:12px;background:var(--orange);color:#fff;display:grid;place-items:center;font-size:28px;margin-bottom:18px}h1{margin:0 0 8px;font-size:28px;letter-spacing:-.02em}p{color:var(--muted);margin:0 0 25px}.field{margin:15px 0}.field label{display:block;font-weight:700;font-size:14px;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid #d8d4cf;border-radius:8px;box-sizing:border-box;font-size:15px;background:#fafafa}.field input:focus{outline:none;border-color:#cf7b3c;box-shadow:0 0 0 3px rgba(200,100,24,.10);background:#fff}.btn{width:100%;padding:13px;border:0;border-radius:8px;background:var(--orange);color:#fff;font-weight:800;font-size:15px;cursor:pointer;margin-top:8px}.btn:hover{background:var(--orange-dark)}.public{display:block;text-align:center;margin-top:18px;color:var(--orange-dark);text-decoration:none;font-weight:700}.public:hover{text-decoration:underline}.flash{padding:12px;border-radius:8px;background:#f9e7df;color:#8f3f16;margin-bottom:15px;font-weight:700}
</style>
<script>
(function(){
  const params=new URLSearchParams(window.location.search);
  const next=params.get('next');
  if(next==='/' || next==='%2F'){
    window.location.replace('/publico');
  }
})();
</script>
</head>
<body><div class="card"><div class="logo">⚽</div><h1>Administración</h1><p>Asociación de Fútbol Presidente Ríos</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="next" value="{{ next }}"><div class="field"><label>Usuario</label><input name="username" autocomplete="username" required></div><div class="field"><label>Contraseña</label><input type="password" name="password" autocomplete="current-password" required></div><button class="btn">Ingresar</button></form><a class="public" href="{{ url_for('publico') }}">← Ir al portal público</a></div></body></html>
